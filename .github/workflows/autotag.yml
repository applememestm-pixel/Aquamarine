name: autotag

# A new version on main becomes a release by itself: when the version in
# Cargo.toml ([workspace.package]) has no v<version> tag yet, this job
# creates the tag and starts release.yml on it — as a pre-release when
# [workspace.metadata.aqua] prerelease = true (see CLAUDE.md, versions).
#
# Tags pushed with the workflow token don't trigger other workflows, so
# the release is started explicitly (workflow_dispatch on the tag ref),
# which is the one event that token is allowed to trigger.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: autotag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version in Cargo.toml
        id: ver
        run: |
          v=$(awk '/^\[workspace.package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[" ]/,"",$0); split($0,a,"="); print a[2]; exit}' Cargo.toml)
          [ -n "$v" ] || { echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          # [workspace.metadata.aqua] prerelease = true → a numbered pre-release.
          pre=$(awk '/^\[workspace.metadata.aqua\]/{f=1;next} /^\[/{f=0} f && /^prerelease *=/{gsub(/[" ]/,"",$0); split($0,a,"="); print a[2]; exit}' Cargo.toml)
          [ "$pre" = "true" ] || pre=false
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $v (pre-release: $pre)"

      # A release of this version that never finished (cancelled while still
      # in the queue, the owner wanted more in it) and main has moved on: take
      # it down and build the version again from main. A finished release
      # (SHA256SUMS.txt is uploaded last) or one still building is left alone.
      - name: Replace an unfinished release of this version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || exit 0
          tagsha=$(git rev-list -n1 "$TAG" 2>/dev/null || true)
          [ "$tagsha" = "$GITHUB_SHA" ] && exit 0
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx SHA256SUMS.txt; then
            echo "$TAG is a finished release - leaving it"; exit 0
          fi
          if gh run list --workflow release.yml --branch "$TAG" --repo "$GITHUB_REPOSITORY" --json status --jq '.[].status' | grep -qvx completed; then
            echo "$TAG is still building - leaving it"; exit 0
          fi
          echo "::warning::$TAG never finished building; main has newer commits for it - building it again from $GITHUB_SHA"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true

      - name: Create the tag if it's new
        id: mk
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists - nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="Aquamarine ${TAG#v}"
          [ -f "docs/releases/$TAG.md" ] || echo "::warning::docs/releases/$TAG.md is missing - the release will have no description"
          git tag -a "$TAG" -m "$msg" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Build the release
        if: steps.mk.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRE: ${{ steps.ver.outputs.prerelease }}
        run: gh workflow run release.yml --ref "$TAG" --repo "$GITHUB_REPOSITORY" -f prerelease="$PRE"
