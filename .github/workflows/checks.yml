name: checks

# The same checks CLAUDE.md asks for before every push, on every pull request
# into main: relay tests, client tests, the app compiles, the UI type-checks.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: checks
      - name: aqua-server
        run: cargo test -p aqua-server
      - name: the rest of the workspace
        run: cargo test --workspace --exclude aqua-server

  app:
    name: app (cargo check + svelte-check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps (GTK / WebKitGTK / D-Bus)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libdbus-1-dev pkg-config build-essential
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/aqua-client-ui/ui/package-lock.json
      - name: UI — install, type-check, build
        working-directory: crates/aqua-client-ui/ui
        run: |
          npm ci --no-audit --no-fund
          npx svelte-check --threshold error
          npm run build
      # The built UI, for looking at it with a mocked Tauri (Playwright) from
      # a session where npm isn't reachable.
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: crates/aqua-client-ui/ui/dist
          retention-days: 3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/aqua-client-ui -> target
          shared-key: checks-app
      - name: IPC names match (UI ↔ Rust)
        run: python3 tools/check-invokes.py
      - name: cargo check + unit tests (desktop app)
        working-directory: crates/aqua-client-ui
        run: |
          cargo check
          cargo test --lib

  ui-shots:
    name: ui screenshots (log)
    needs: app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui-dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Screenshots of the profile editor (base64 in this log)
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji
          mkdir -p /tmp/pw && (cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.48.2)
          (cd /tmp/pw && npx playwright install --with-deps chromium)
          NODE_PATH=/tmp/pw/node_modules node tools/ui-shots.js ui-dist /tmp/shots "#F2EEE6"

  server-app:
    name: server app (cargo check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps (GTK / WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/aqua-server-app -> target
          shared-key: checks-server-app
      - name: cargo check (Aquamarine Server)
        working-directory: crates/aqua-server-app
        run: cargo check
