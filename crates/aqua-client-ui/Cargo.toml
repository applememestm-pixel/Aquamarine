[package]
name        = "aqua-client-ui"
version     = "0.0.1"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Aquamarine desktop shell — Tauri 2 + Svelte + TypeScript."

[[bin]]
name = "aqua-client-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aqua-core        = { path = "../aqua-core" }
aqua-client-core = { path = "../aqua-client-core" }

tauri               = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log    = { version = "2" }
tauri-plugin-dialog = { version = "2" }
dirs                = "5"
keyring             = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

tokio        = { version = "1", features = ["full"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
serde_bytes  = "0.11"
bincode      = "1.3"
base64       = "0.22"
thiserror    = "2"
anyhow       = "1"
hex          = "0.4"
sha2         = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
# By default, Tauri runs in production mode. When `tauri dev` runs, it
# is executed with `cargo run --no-default-features` if `devPath` is an
# URL in `tauri.conf.json` — but since we always ship both dev URL and
# built assets, we don't need custom features here.
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
# `--cfg aqua_wincheck` type-checks the Windows-only activity detector on Linux.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aqua_wincheck)'] }
