name: Android release APK — Keystore

# The release build (R8 and all) on emulators: the vault key's move into the
# Keystore across a restart (tools/android_keystore_test.sh). An emulator's
# Keystore is software: real phones still need checking by hand.
on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "crates/aqua-client-ui/src/vault_key.rs"
      - "crates/aqua-client-ui/src/relay_host.rs"
      - "crates/aqua-client-ui/src/state.rs"
      - "crates/aqua-client-ui/src/lib.rs"
      - "tools/android_keystore_test.sh"
      - ".github/workflows/android-keystore-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-keystore-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: release APK (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/aqua-client-ui -> target
          shared-key: android-keystore-check
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/aqua-client-ui/ui/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-2
      - name: Install Tauri CLI
        run: command -v cargo-tauri || cargo install tauri-cli --version '^2' --locked
      - name: Frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: crates/aqua-client-ui/ui
      - name: Generate and patch Android project
        working-directory: crates/aqua-client-ui
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          cargo tauri android init --ci
          bash ../../android/patch-project.sh
      - name: Build release APK, signed with a throwaway key
        working-directory: crates/aqua-client-ui
        run: |
          cargo tauri android build --apk --target x86_64 --ci
          apk=$(find gen/android -name '*release*.apk' | head -1)
          keytool -genkeypair -keystore /tmp/ks.jks -storepass throwaway -keypass throwaway \
            -alias test -keyalg RSA -keysize 2048 -validity 30 -dname "CN=test"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/zipalign" -f -p 4 "$apk" /tmp/aligned.apk
          "$bt/apksigner" sign --ks /tmp/ks.jks --ks-pass pass:throwaway --key-pass pass:throwaway \
            --ks-key-alias test --out "$GITHUB_WORKSPACE/keystore-test.apk" /tmp/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-test-apk
          path: keystore-test.apk
          if-no-files-found: error
          retention-days: 3

  emulator:
    name: emulator (API ${{ matrix.api }})
    needs: apk
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: keystore-test-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash tools/android_keystore_test.sh keystore-test.apk
