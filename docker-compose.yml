# Aquamarine website on http://<host>:8080/ (the relay runs natively, not here).
#   docker compose up -d          build from this checkout and start
#   docker compose pull && docker compose up -d    the published image instead
services:
  site:
    image: ghcr.io/applememestm-pixel/aquamarine-site:latest
    build: .
    container_name: aquamarine-site
    restart: unless-stopped
    ports:
      - "8080:8080"
