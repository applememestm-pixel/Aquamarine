<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Aquamarine Server</title>
<style>
  :root {
    --bg: #06070C; --side: #0A0D14; --card: #0E121B; --card2: #121826; --line: #1E2533; --line2: #2A3346;
    --fg: #E8EEF7; --dim: #8A96A8; --dim2: #5E6A7D;
    --accent: #2EE6C5; --accent2: #6C8CFF; --bad: #FF6B81; --warn: #F0B232; --ok: #3DDC97;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { display: grid; grid-template-columns: 220px 1fr; overflow: hidden; }
  [hidden] { display: none !important; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- navigation ---- */
  nav { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: calc(14px + env(safe-area-inset-top)) 10px 14px; gap: 2px; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; font-weight: 800; color: #06070C; flex: none; }
  .brand b { font-size: 14.5px; line-height: 1.15; }
  .brand small { display: block; color: var(--dim); font-size: 11.5px; font-weight: 600; }
  .nav-btn { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 11px; border: 0; border-radius: 10px; background: none; color: var(--dim); font: inherit; font-weight: 600; text-align: left; cursor: pointer; position: relative; }
  .nav-btn:hover { background: #121826; color: var(--fg); }
  .nav-btn.on { background: linear-gradient(90deg, rgba(46,230,197,.14), rgba(46,230,197,.02)); color: var(--fg); }
  .nav-btn.on svg { color: var(--accent); }
  .nav-btn .badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #06070C; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
  .nav-foot { margin-top: auto; padding: 10px 8px 0; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim); font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim2); flex: none; }
  .dot.on { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .dot.err { background: var(--bad); }

  /* ---- pages ---- */
  main { min-height: 0; overflow-y: auto; padding: calc(22px + env(safe-area-inset-top)) 28px 40px; }
  .page { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; animation: in .22s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  .lead { color: var(--dim); margin: -2px 0 6px; max-width: 640px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { margin: 0; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .card h2 .grow { flex: 1; }
  .note { font-size: 12.5px; color: var(--dim); }
  .card.upd { flex-direction: row; align-items: center; gap: 14px; border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .card.upd .t { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .card.upd .t span { font-size: 12.5px; color: var(--dim); }
  .note b { color: var(--fg); }
  .msg { font-size: 13px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--bad); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  a { color: var(--accent); cursor: pointer; text-decoration: none; }
  a:hover { text-decoration: underline; }

  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line2); background: #151B27; color: var(--fg); padding: 8px 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
  button:hover { border-color: #3A4763; }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #06070C; border: none; }
  button.danger { color: var(--bad); }
  button.mini { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
  button.ghost { background: none; border-color: transparent; color: var(--dim); }
  button.ghost:hover { color: var(--fg); background: #121826; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=text], input[type=number], input[type=password], input[type=email], textarea {
    background: #0A0D14; border: 1px solid var(--line2); color: var(--fg); border-radius: 10px; padding: 9px 11px; font: inherit; width: 100%; outline: none; }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 96px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--dim); font-weight: 600; flex: 1; min-width: 140px; }
  code, .mono { font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; }

  /* switch row */
  .sw { display: flex; align-items: center; gap: 14px; cursor: pointer; padding: 2px 0; }
  .sw .t { flex: 1; }
  .sw .t b { display: block; font-weight: 650; }
  .sw .t span { font-size: 12.5px; color: var(--dim); }
  .tog { width: 42px; height: 24px; border-radius: 12px; background: #263044; position: relative; flex: none; transition: background .15s; }
  .tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .tog.on { background: var(--accent); }
  .tog.on::after { transform: translateX(18px); }

  /* segmented */
  .seg { align-self: flex-start; display: inline-flex; background: #0A0D14; border: 1px solid var(--line2); border-radius: 11px; padding: 3px; gap: 3px; flex-wrap: wrap; }
  .seg button { border: 0; background: none; color: var(--dim); padding: 7px 14px; border-radius: 8px; }
  .seg button.on { background: #1C2433; color: var(--fg); }

  /* hero */
  .hero { display: flex; flex-direction: row; align-items: center; gap: 18px; padding: 20px; background: radial-gradient(120% 140% at 0% 0%, rgba(46,230,197,.12), transparent 55%), var(--card); }
  .pulse { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: #151B27; flex: none; position: relative; }
  .pulse i { width: 16px; height: 16px; border-radius: 50%; background: var(--dim2); }
  .pulse.on i { background: var(--accent); box-shadow: 0 0 16px var(--accent); }
  .pulse.on::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); animation: ring 2s ease-out infinite; }
  @keyframes ring { from { transform: scale(.6); opacity: .8; } to { transform: scale(1.25); opacity: 0; } }
  .pulse.err i { background: var(--bad); }
  .hero .t { flex: 1; min-width: 0; }
  .hero .t b { font-size: 19px; font-weight: 800; display: block; }
  .hero .t span { color: var(--dim); font-size: 13px; }
  .hero button { padding: 11px 20px; font-size: 14.5px; }

  /* stat tiles */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; color: var(--fg); font-weight: 400; transition: border-color .15s, transform .15s; }
  .stat:hover { border-color: #3A4763; transform: translateY(-1px); }
  .stat .ic { color: var(--accent); }
  .stat .n { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .stat .l { font-size: 12.5px; color: var(--dim); font-weight: 600; }

  /* addresses */
  .addr { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #0A0D14; border: 1px solid var(--line); border-radius: 11px; }
  .addr .k { width: 150px; flex: none; font-size: 12.5px; color: var(--dim); font-weight: 600; }
  .addr code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: all; }
  .addr.off code { color: var(--dim2); font-family: inherit; font-size: 12.5px; white-space: normal; }

  /* lists */
  .list { display: flex; flex-direction: column; }
  .li { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); min-width: 0; }
  .li:last-child { border-bottom: 0; }
  .li .main { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li .sub { color: var(--dim); font-size: 12.5px; flex: none; }
  .ava { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #06070C; flex: none; }
  .ev { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 7px; background: #1C2433; color: var(--dim); flex: none; }
  .ev.online, .ev.login { color: var(--accent); background: rgba(46,230,197,.1); }
  .ev.register { color: var(--accent2); background: rgba(108,140,255,.12); }
  .bar { width: 120px; height: 6px; border-radius: 3px; background: #1C2433; overflow: hidden; flex: none; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .empty { color: var(--dim); text-align: center; padding: 22px 8px; font-size: 13px; }
  .tag { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 7px; background: #1C2433; color: var(--dim); }
  .tag.net { color: var(--accent); background: rgba(46,230,197,.1); }
  .code-big { font: 800 20px ui-monospace, Consolas, monospace; letter-spacing: .12em; color: var(--accent); }

  /* off-state placeholder */
  .off-box { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--dim); }
  .off-box svg { width: 40px; height: 40px; color: var(--dim2); }

  /* packs */
  .packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .pack { background: #0A0D14; border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .pack .pv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .pack .pv img, .pack .pv video, .pack .pv span { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 6px; background: #121826; display: grid; place-items: center; font-size: 10px; color: var(--dim); }
  .pack b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pack small { color: var(--dim); font-size: 12px; }

  /* modal & toast */
  .modal { position: fixed; inset: 0; background: rgba(3,4,8,.72); display: grid; place-items: center; z-index: 20; padding: 16px; animation: fade .15s; }
  @keyframes fade { from { opacity: 0; } }
  .modal .box { background: var(--card); border: 1px solid var(--line2); border-radius: 18px; padding: 20px; width: min(440px, 100%); max-height: 86vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .modal .box h3 { margin: 0; font-size: 17px; display: flex; align-items: center; }
  .modal .box h3 span { flex: 1; }
  .qr { background: #fff; border-radius: 14px; padding: 12px; align-self: center; width: min(280px, 100%); }
  .qr svg { display: block; width: 100%; height: auto; }
  .choice { display: flex; gap: 12px; padding: 14px; border: 1px solid var(--line2); border-radius: 14px; cursor: pointer; text-align: left; background: #0A0D14; color: var(--fg); font-weight: 400; align-items: flex-start; }
  .choice:hover { border-color: var(--accent); }
  .choice svg { width: 26px; height: 26px; color: var(--accent); }
  .choice b { display: block; font-size: 15px; margin-bottom: 2px; }
  .choice span { color: var(--dim); font-size: 13px; }
  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: #1C2433; border: 1px solid var(--line2); padding: 9px 16px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: .2s; z-index: 30; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  details summary { cursor: pointer; color: var(--dim); font-weight: 600; font-size: 13px; }
  details[open] summary { margin-bottom: 12px; }

  /* ---- phones and narrow windows: tabs at the bottom ---- */
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    nav { grid-row: 2; flex-direction: row; border-right: 0; border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); overflow-x: auto; gap: 0; }
    .brand, .nav-foot { display: none; }
    .nav-btn { flex-direction: column; gap: 3px; font-size: 10px; padding: 6px 2px; min-width: 0; flex: 1 1 0; text-align: center; justify-content: center; }
    .nav-btn.on { background: none; color: var(--accent); }
    .nav-btn span:not(.badge) { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-btn .badge { position: absolute; top: 2px; right: 6px; margin: 0; }
    main { grid-row: 1; padding: calc(16px + env(safe-area-inset-top)) 16px 24px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .grid2 { grid-template-columns: 1fr; }
    .addr { flex-wrap: wrap; }
    .addr .k { width: 100%; }
    .hero { flex-wrap: wrap; }
    .hero button { width: 100%; justify-content: center; }
    .bar { width: 70px; }
  }
</style>
</head>

function showQr(text, title, note) {

    <div class="note" style="text-align:center">${esc(note || t("Scan it in Aquamarine: sign-in → Scan QR."))}</div>

  if (!st?.running) return needRunning(el, "Stickers");
  el.innerHTML = `<div><h1>${t("Stickers")}</h1></div>
    <div class="card"><h2>${t("Telegram bot")}</h2><div class="note" id="tState">…</div>
      <div class="note">${t("tgNote")}</div>
      <div class="row"><label class="f" style="flex:1">${t("Bot token")}<input type="password" id="tTok" autocomplete="off"></label></div>
      <div class="note" style="color:var(--warn)">${t("tgSecret")}</div>
      <div class="row"><button class="primary" onclick="saveTg(false)">${t("Save")}</button><button class="danger" id="tDel" onclick="saveTg(true)">${t("Remove token")}</button><span class="msg" id="tMsg"></span></div></div>
    <div class="card"><h2>${t("Packs on this server")} <span id="packsN"></span></h2><div class="packs" id="packs"></div></div>`;
  api("/v1/admin/telegram").then(showTg).catch((e) => setMsg("tMsg", esc(errText(e)), "err"));
}
function showTg(v) {
  if (!$("tState")) return;
  $("tState").innerHTML = v.has_token ? t("tgOn", { n: v.packs }) + (v.source === "env" ? t("tgEnv") : "") : t("tgOff");
  $("tTok").disabled = v.source === "env"; $("tDel").disabled = !v.has_token || v.source === "env";
  $("tTok").placeholder = v.has_token ? "•••••••• " + t("saved — paste a new one to replace") : "123456789:AA…";
  const base = st.local_url || "";
  const packs = v.list || [];
  $("packsN").textContent = packs.length ? "· " + packs.length : "";
  $("packs").innerHTML = packs.length ? packs.map((p) => `<div class="pack"><div class="pv">${(p.preview || []).map(([f, mime]) => {
      const src = `${base}/v1/packs/${encodeURIComponent(p.name)}/${encodeURIComponent(f)}`;
      return mime.startsWith("video/") ? `<video src="${src}" muted loop autoplay playsinline></video>` : mime.startsWith("image/") ? `<img src="${src}" alt="" loading="lazy">` : `<span>TGS</span>`; }).join("")}</div>
      <b>${esc(p.title || p.name)}</b><small>${p.count} · ${t(p.kind === "custom_emoji" ? "emoji " : "stickers ")}</small></div>`).join("")
    : `<div class="empty" style="grid-column:1/-1">${t("noPacks")}</div>`;
}
async function saveTg(remove) {
  const token = remove ? "" : $("tTok").value.trim();
  if (!remove && !token) return setMsg("tMsg", t("Paste the token first."), "err");
  try { const v = await api("/v1/admin/telegram", "POST", { token }); $("tTok").value = ""; showTg(v); setMsg("tMsg", remove ? t("Token removed.") : t("savedTg"), "ok"); }
  catch (e) { setMsg("tMsg", t("Failed: ") + esc(errText(e)), "err"); }
}

// ---------------------------------------------------------------- Settings
function pageSettings(el) {
  const s = st || {};
  el.innerHTML = `<div><h1>${t("Settings")}</h1></div>
    <div class="card"><h2>${t("Server")}</h2>
      <div class="row" style="align-items:flex-end"><label class="f" style="max-width:140px">${t("Port")}<input type="number" id="port" min="1024" max="65535" value="${s.port || 7777}"></label>
        <button onclick="setPort()">${t("Apply")}</button></div>
      <div class="note">${t("portNote")}</div><span class="msg" id="portMsg"></span></div>
    <div class="card"><h2>${t("Data folder")}</h2><code style="word-break:break-all">${esc(s.dir || "—")}</code><div class="note" id="ddSize"></div>
      <div class="note">${t("dataNote")}</div>
      ${s.mobile ? "" : `<div class="row"><button class="mini" onclick="chooseDir(false)">${t("Use another folder…")}</button><button class="mini" onclick="chooseDir(true)">${t("Move the data to…")}</button></div>`}
      <span class="msg" id="dirMsg"></span></div>
    ${s.mobile ? `<div class="card"><div class="note">${t("mobNote")}</div></div>` : `
    <div class="card"><h2>${t("This computer")}</h2>
      <div class="sw" onclick="setSys('set_autostart', !st.autostart)"><div class="t"><b>${t("Start with the system")}</b><span>${t("autoSub")}</span></div><span class="tog ${s.autostart ? "on" : ""}"></span></div>
      <div class="sw" onclick="setSys('set_tray', !st.tray)"><div class="t"><b>${t("Keep running when the window is closed")}</b><span>${t("traySub")}</span></div><span class="tog ${s.tray ? "on" : ""}"></span></div></div>`}
    <div class="card"><h2>${t("Updates")}</h2>
      <div class="sw" onclick="setAutoUpd(!upd?.auto)"><div class="t"><b>${t("Update automatically")}</b><span>${t("autoUpdSub")}</span></div><span class="tog ${upd?.auto ? "on" : ""}" id="updTog"></span></div>
      <div id="updSet"></div></div>
    <div class="card"><h2>${t("About")}</h2><div class="note">Aquamarine Server · ${t("Version")} ${esc(version)}</div>
      <a onclick="invoke('open_guide')">${t("Step by step: router, public IP, what to do without one")} →</a></div>`;
  paintUpd();
  if (s.running) api("/v1/admin/datadir").then((d) => { if ($("ddSize")) $("ddSize").textContent = human(d.bytes); }).catch(() => {});
}
async function setPort() {
  try { st = await invoke("set_port", { port: Number($("port").value) }); setMsg("portMsg", t("Saved."), "ok"); paintAll(); }
  catch (e) { setMsg("portMsg", t("Failed: ") + esc(errText(e)), "err"); }
}
async function chooseDir(copyData) {
  if (st?.running) return setMsg("dirMsg", t("Stop the server first"), "err");
  const p = await invoke("pick_dir"); if (!p) return;
  try { st = await invoke("set_dir", { path: p, copy: copyData }); render(); }
  catch (e) { setMsg("dirMsg", t("Failed: ") + esc(errText(e)), "err"); }
}
async function setSys(cmd, on) { try { st = await invoke(cmd, { on }); } catch (e) { toast(errText(e)); } render(); }

// ---------------------------------------------------------------- updates
let upd = null;
function updLine() {
  const u = upd; if (!u) return "";
  const v = u.version ? esc(u.version) : "";
  switch (u.state) {
    case "checking": return t("Checking for updates…");
    case "latest": return t("This is the latest version.");
    case "waiting": return t("Version {v} is out, its file for this device is still being built.", { v });
    case "downloading": return t("Downloading {v}…", { v }) + (u.total ? ` ${Math.floor(u.done * 100 / u.total)}%` : "");
    case "ready": return u.can_self_install ? t("Version {v} is downloaded.", { v }) : t("Version {v} is ready to install.", { v });
    case "installing": return t("Installing — the server will be back in a few seconds…");
    case "error": return t("Couldn't check for updates: ") + esc(u.error || "");
    default: return "";
  }
}
function updButtons() {
  const u = upd; if (!u) return "";
  if (u.state === "ready") return `<button class="primary mini" onclick="updNow(true)">${IC.refresh}${t("Update now")}</button>`;
  if (["checking", "downloading", "installing"].includes(u.state)) return "";
  return `<button class="mini" onclick="updNow(false)">${IC.refresh}${t("Check now")}</button>`;
}
function paintUpd() {
  const set = $("updSet");
  if (set) { const h = `<div class="note">${t("Version")} ${esc(upd?.current || version)} · ${updLine()}</div><div class="row">${updButtons()}${upd?.notes_url && upd?.version ? `<a onclick="invoke('open_notes').catch(()=>{})">${t("What's new")} →</a>` : ""}</div>`;
    if (set.dataset.h !== h) { set.dataset.h = h; set.innerHTML = h; } }
  if ($("updTog")) $("updTog").className = "tog" + (upd?.auto ? " on" : "");
  const box = $("updBox");
  if (box) {
    const show = upd && upd.version && ["waiting", "downloading", "ready", "installing"].includes(upd.state) && !(upd.state === "waiting");
    const h = show ? `<div class="card upd"><div class="t"><b>${t("A new version: {v}", { v: esc(upd.version) })}</b><span>${updLine()}</span></div>${updButtons()}</div>` : "";
    if (box.dataset.h !== h) { box.dataset.h = h; box.innerHTML = h; }
  }
}
async function setAutoUpd(on) { try { upd = await invoke("set_auto_update", { on }); } catch (e) { toast(errText(e)); } paintUpd(); }
async function updNow(install) {
  if (install) { upd = { ...upd, state: "installing" }; paintUpd(); }
  else { upd = { ...upd, state: "checking" }; paintUpd(); }
  try { upd = await invoke("update_now", { install }); } catch (e) { upd = { ...upd, state: "error", error: errText(e) }; }
  paintUpd();
}

// ======================================================================
// Polling
// ======================================================================
function paintAll() {
  const on = st?.running;
  if ($("navDot")) { $("navDot").className = "dot" + (on ? " on" : st?.error ? " err" : ""); $("navText").textContent = busy ? t("Starting…") : on ? t("Running") + (stats ? " · " + (stats.online) + " " + t("online") : "") : t("Stopped"); }
  paintHome(); paintCodes(); paintUpd();
}
let wasRunning = null;
async function poll(force) {
  try { st = await invoke("status"); } catch (e) { console.warn(e); return; }
  try { upd = await invoke("update_status"); } catch {}
  if (st.running) {
    try { stats = await api("/v1/admin/stats"); } catch { stats = null; }
    if (!fed || force) await loadFed();
  } else { stats = null; }
  // The server came up or went down: pages that need it redraw.
  if (wasRunning !== null && wasRunning !== st.running && page !== "home" && page !== "settings") render();
  wasRunning = st.running;
  paintAll();
  if (page === "people") loadPeople();
}
(async () => {
  try { version = await window.__TAURI__.app.getVersion(); } catch {}
  buildNav();
  await poll(true);
  render();
  setInterval(() => { if (!document.hidden) poll(false); }, 4000);
})();
</script>
</body>
</html>
