name: checks

# The same checks CLAUDE.md asks for before every push, on every pull request
# into main: relay tests, client tests, the app compiles, the UI type-checks.
on:
  pull_request:
    branches: [main]
  # AQUA-SEC-014: also after a merge, so main itself is checked (a merge of
  # two green PRs can still break it).
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: these jobs only build and test.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Known vulnerabilities in dependencies (RustSec, npm) in all three
  # Cargo.lock files and the UI. A failure fails the PR (REV2: no
  # continue-on-error); "unmaintained" warnings don't fail cargo audit.
  audit:
    name: dependency audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (relay, core, client-core)
        run: cargo audit
      - name: cargo audit (app)
        if: always()
        run: cargo audit --file crates/aqua-client-ui/Cargo.lock
      - name: cargo audit (server app)
        if: always()
        run: cargo audit --file crates/aqua-server-app/Cargo.lock
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 22
      - name: npm audit (app UI)
        if: always()
        working-directory: crates/aqua-client-ui/ui
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: cargo test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: checks
      - name: aqua-server
        run: cargo test -p aqua-server
      - name: the rest of the workspace
        run: cargo test --workspace --exclude aqua-server
      # The app's Android build runs only in release.yml: check voice-to-text
      # (ONNX Runtime loaded at run time) for Android here, before a merge.
      - name: aqua-stt for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo check -p aqua-stt --target aarch64-linux-android
          cargo check -p aqua-stt --target armv7-linux-androideabi

  # Voice-to-text end to end: the files from the stt release (cached), then
  # the Rust pipeline must give onnx-asr's text (crates/aqua-stt/tests/e2e.rs).
  stt:
    name: stt e2e
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: checks
      - uses: actions/cache@v4
        with:
          path: stt-files
          key: stt-${{ hashFiles('crates/aqua-stt/src/files.rs') }}
      - name: Files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(grep -oP 'RELEASE_TAG: &str = "\K[^"]+' crates/aqua-stt/src/files.rs)
          mkdir -p stt-files
          for f in stt-model.onnx stt-pre.onnx stt-vocab.txt ort-linux-x64.so stt-example.pcm stt-example.txt stt-long_example.pcm; do
            [ -f "stt-files/$f" ] || gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$f" -D stt-files
          done
          touch stt-files/verified
      - run: cargo test -p aqua-stt --test e2e -- --nocapture
        env:
          AQUA_STT_DIR: ${{ github.workspace }}/stt-files

  app:
    name: app (cargo check + svelte-check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps (GTK / WebKitGTK / D-Bus)
        run: |
          sudo bash tools/apt-update.sh
          sudo timeout 600 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libdbus-1-dev pkg-config build-essential
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/aqua-client-ui/ui/package-lock.json
      - name: UI — install, type-check, build
        working-directory: crates/aqua-client-ui/ui
        run: |
          npm ci --no-audit --no-fund
          npx svelte-check --threshold error
          npm run test:unit
          npm run build
      # The built UI, for looking at it with a mocked Tauri (Playwright) from
      # a session where npm isn't reachable.
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: crates/aqua-client-ui/ui/dist
          retention-days: 3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/aqua-client-ui -> target
          shared-key: checks-app
      - name: IPC names match (UI ↔ Rust)
        run: python3 tools/check-invokes.py
      - name: settings search index is up to date
        run: python3 tools/settings_index.py --check
      - name: Android plugins and services (release APK)
        run: python3 tools/check_android.py
      - name: the site script installs only a signed release (AQUA-SEC-012)
        run: bash tools/site-verify-test.sh
      - name: cargo check + unit tests (desktop app)
        working-directory: crates/aqua-client-ui
        run: |
          cargo check
          cargo test --lib

  # The app's Rust for Android (mesh_android.rs, NDK calls): built only in
  # release.yml before — a mistake there showed up at release time. Advisory
  # (continue-on-error) until it has a run of green behind it.
  app-android:
    name: app (android cargo check, advisory)
    runs-on: ubuntu-22.04
    needs: app
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/aqua-client-ui/ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/aqua-client-ui -> target
          shared-key: checks-app-android
      - name: cargo check --target aarch64-linux-android
        working-directory: crates/aqua-client-ui
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$bin/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo check --lib --target aarch64-linux-android

  ui-shots:
    name: ui screenshots (log)
    needs: app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui-dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Screenshots of the profile editor (base64 in this log)
        run: |
          sudo bash tools/apt-update.sh && sudo timeout 600 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y fonts-noto-color-emoji
          mkdir -p /tmp/pw && (cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.48.2)
          (cd /tmp/pw && npx playwright install --with-deps chromium)
          SHOTS_SETTINGS=1 NODE_PATH=/tmp/pw/node_modules node tools/ui-shots.js ui-dist /tmp/shots "#F2EEE6"

  server-app:
    name: server app (cargo check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps (GTK / WebKitGTK)
        run: |
          sudo bash tools/apt-update.sh
          sudo timeout 600 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/aqua-server-app -> target
          shared-key: checks-server-app
      - name: cargo check (Aquamarine Server)
        working-directory: crates/aqua-server-app
        run: cargo check
      # Its own tests (updates.rs, remote.rs): they weren't run before.
      - name: cargo test (Aquamarine Server)
        working-directory: crates/aqua-server-app
        run: cargo test --bins --lib
