name: pages

# Publishes the site in site/ to GitHub Pages, together with the Markdown
# documents it renders (docs/*.md and the README as docs/passport.md).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "addons/**", "README.md", ".github/workflows/pages.yml", "tools/updates_feed.py", "tools/addons_feed.py"]
  # updates.json (below) follows every release run — and once in a while, in
  # case a release was edited by hand.
  workflow_run:
    workflows: [release, release retry]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Add the documents
        run: |
          mkdir -p site/docs
          cp docs/*.md site/docs/
          cp README.md site/docs/passport.md
      # What the apps read when GitHub's API answers 403 (shared mobile
      # addresses): tools/updates_feed.py.
      - name: Add the update feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/updates_feed.py "$GITHUB_REPOSITORY" site/updates.json
      # The add-on catalogue (addons.html): plugins from addons/ and from
      # public repositories with the topic "aquamarine-plugin".
      - name: Add the add-on catalogue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/addons_feed.py "$GITHUB_REPOSITORY" site/addons.json || echo '{"items":[]}' > site/addons.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
