name: Python SDK

on:
  push:
    branches: [main]
    paths: ["sdk/python/**", ".github/workflows/sdk-python.yml"]
    tags: ["sdk-py-v*"]
  pull_request:
    paths: ["sdk/python/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        working-directory: sdk/python/tests
        run: PYTHONPATH=../src python -m unittest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build
          python -m build
          ls -l dist
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/sdk-py-v')
        working-directory: sdk/python
        run: |
          want="${GITHUB_REF_NAME#sdk-py-v}"
          have=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$want" = "$have" ] || { echo "tag $want != pyproject $have"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: aquabot-dist
          path: sdk/python/dist/*

  # Tag sdk-py-vX.Y.Z → a GitHub release with the wheel.
  release:
    if: startsWith(github.ref, 'refs/tags/sdk-py-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aquabot-dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: "aquabot (Python SDK) ${{ github.ref_name }}"
          body: |
            Python library for Aquamarine bots: bot framework, LLM connectors (llama.cpp, Ollama, OpenAI-compatible, Anthropic), math toolkit.

            ```
            pip install "git+https://github.com/${{ github.repository }}@${{ github.ref_name }}#subdirectory=sdk/python"
            ```
            or download the `.whl` below and `pip install aquamarine_bot-*.whl`.
          files: dist/*
          make_latest: false

  # PyPI via trusted publishing. One-time setup on pypi.org:
  #   Publishing → Add a new pending publisher → owner/repo, workflow "sdk-python.yml", environment "pypi";
  # then set the repository variable PYPI_PUBLISH=1 (Settings → Secrets and variables → Actions → Variables).
  pypi:
    if: startsWith(github.ref, 'refs/tags/sdk-py-v') && vars.PYPI_PUBLISH == '1'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aquabot-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
