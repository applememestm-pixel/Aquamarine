# Aquamarine relay.
#   docker compose up -d          build (first time ~5 min) and start
#   docker compose logs -f        log; e-mail codes show here until SMTP is set up
#   docker compose pull && docker compose up -d    with the published image
services:
  relay:
    image: ghcr.io/applememestm-pixel/aquamarine-server:latest
    build: .
    container_name: aquamarine
    restart: unless-stopped
    ports:
      - "7777:7777"
    volumes:
      - aquamarine-data:/data
    environment:
      AQUA_LISTEN: 0.0.0.0:7777
      AQUA_TG_PROMPT: "0"
      # Admin panel at http://<host>:7777/admin (set your own token):
      # AQUA_ADMIN_TOKEN: change-me
      # Public address of this relay (behind HTTPS):
      # AQUA_PUBLIC_URL: https://relay.example.org

volumes:
  aquamarine-data:
