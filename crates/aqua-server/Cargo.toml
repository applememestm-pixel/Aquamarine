[package]
name        = "aqua-server"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
description = "Aquamarine signaling / relay server (WebSocket, HTTP prekey directory)."

[dependencies]
aqua-core = { path = "../aqua-core" }

tokio               = { workspace = true }
axum                = { workspace = true }
tower               = { workspace = true }
tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }
futures-util        = { workspace = true }
uuid                = { workspace = true }
dashmap             = { workspace = true }

# Auth crypto
hmac                = { workspace = true }
sha2                = { workspace = true }
subtle              = { workspace = true }
rand_core           = { workspace = true }
hex                 = "0.4"

serde       = { workspace = true }
serde_bytes = { workspace = true }
serde_json  = { workspace = true }
bincode     = { workspace = true }
base64      = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
nu-ansi-term = "0.50"   # coloured banner; turns on ANSI in the Windows console

# Persistent user directory (usernames, profiles, email codes).
rusqlite    = { version = "0.32", features = ["bundled"] }

# Optional real e-mail delivery for verification codes. When the
# AQUA_SMTP_* env vars are set the server sends real mail; otherwise it
# falls back to the dev-code path (logged + returned in the response).
lettre      = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls", "tokio1"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "aqua-server"
path = "src/main.rs"

[dev-dependencies]
reqwest            = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite  = "0.24"
base64             = { workspace = true }
