name: release

# Builds the desktop client (Tauri) and the relay server for Windows, macOS
# and Linux. Tauri can't cross-compile, so each OS builds on its own runner.
# Artifacts are uploaded for every run; on a v* tag they're attached to the
# GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- desktop
  desktop:
    name: desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            rust-target: x86_64-pc-windows-msvc
          - os: macos-latest
            name: macos-arm64
            rust-target: aarch64-apple-darwin
          - os: macos-15-intel
            name: macos-x64
            rust-target: x86_64-apple-darwin
          - os: ubuntu-22.04
            name: linux-x64
            rust-target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps (GTK / WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev build-essential curl wget file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/aqua-client-ui -> target
          shared-key: tauri-${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/aqua-client-ui/ui/package-lock.json

      - name: Build frontend
        working-directory: crates/aqua-client-ui/ui
        run: |
          npm ci
          npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build Tauri bundles
        working-directory: crates/aqua-client-ui
        run: cargo tauri build --target ${{ matrix.rust-target }}

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist
          base="crates/aqua-client-ui/target/${{ matrix.rust-target }}/release"
          # Windows: NSIS + MSI
          find "$base/bundle" -type f \( -name '*-setup.exe' -o -name '*.msi' \) -exec cp {} dist/ \; 2>/dev/null || true
          # macOS: DMG (+ zipped .app)
          find "$base/bundle" -type f -name '*.dmg' -exec cp {} dist/ \; 2>/dev/null || true
          # Linux: AppImage + deb + rpm
          find "$base/bundle" -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist/ \; 2>/dev/null || true
          # Stable copies so the website can link releases/latest/download/<name>
          shopt -s nullglob
          for f in dist/*-setup.exe; do cp "$f" dist/Aquamarine-Setup.exe; done
          for f in dist/*.AppImage; do [ "$f" != dist/Aquamarine.AppImage ] && cp "$f" dist/Aquamarine.AppImage; done
          for f in dist/*.dmg; do
            if [ "${{ matrix.name }}" = macos-arm64 ]; then cp "$f" dist/Aquamarine.dmg
            else cp "$f" dist/Aquamarine-Intel.dmg; fi
          done
          ls -la dist || true

      - uses: actions/upload-artifact@v4
        with:
          name: aquamarine-${{ matrix.name }}
          path: dist/*
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # ---------------------------------------------------------------- android
  android:
    name: mobile (android)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/aqua-client-ui -> target
          shared-key: tauri-android

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/aqua-client-ui/ui/package-lock.json

      - name: Frontend deps
        working-directory: crates/aqua-client-ui/ui
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Generate Android project
        working-directory: crates/aqua-client-ui
        run: |
          cargo tauri android init --ci
          # Calls need mic + camera; notifications; legacy Downloads write.
          m=gen/android/app/src/main/AndroidManifest.xml
          perms='<uses-permission android:name="android.permission.ACCESS_LOCAL_NETWORK" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application'
          sed -i "0,/<application/s##${perms}#" "$m"
          grep -n 'permission' "$m"
          # Launcher icon
          cp -r icons/android/* gen/android/app/src/main/res/
          # MainActivity asking for Android 17 local-network access
          cp ../../android/MainActivity.kt "$(find gen/android/app/src/main/java -name MainActivity.kt | head -1)"

      - name: Build APK
        working-directory: crates/aqua-client-ui
        run: cargo tauri android build --apk --target aarch64 --target armv7 --ci

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          apk=$(find crates/aqua-client-ui/gen/android -name '*universal*release*.apk' | head -1)
          [ -n "$apk" ] || apk=$(find crates/aqua-client-ui/gen/android -name '*release*.apk' | head -1)
          echo "unsigned: $apk"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
          else
            # No signing secrets yet: throwaway key. Works, but each build has
            # a different key, so updates need uninstall → install.
            echo "::warning::ANDROID_KEYSTORE_B64 not set — signing with a throwaway key"
            KS_PASS=aquamarine; KS_ALIAS=aquamarine
            keytool -genkeypair -keystore ks.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Aquamarine, O=Aquamarine, C=RU"
          fi
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/zipalign" -f -p 4 "$apk" aligned.apk
          mkdir -p dist
          "$bt/apksigner" sign --ks ks.jks --ks-pass "pass:$KS_PASS" --key-pass "pass:${KS_PASS}" \
            --ks-key-alias "$KS_ALIAS" --out dist/Aquamarine.apk aligned.apk
          "$bt/apksigner" verify dist/Aquamarine.apk
          rm -f ks.jks dist/*.idsig
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: aquamarine-android
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # ---------------------------------------------------------------- ios
  # Unsigned .ipa for sideloading (AltStore / SideStore / Sideloadly re-sign it
  # with your Apple ID). App Store / TestFlight needs a paid Apple developer
  # account and signing secrets — not set up yet, so this job is best-effort.
  ios:
    name: mobile (ios, unsigned)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/aqua-client-ui -> target
          shared-key: tauri-ios

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/aqua-client-ui/ui/package-lock.json

      - name: Frontend deps
        working-directory: crates/aqua-client-ui/ui
        run: npm ci

      - name: Tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cargo install tauri-cli --version '^2' --locked

      - name: Generate Xcode project
        working-directory: crates/aqua-client-ui
        env:
          APPLE_DEVELOPMENT_TEAM: "0000000000"
        run: cargo tauri ios init --ci

      # Tauri doesn't forward signing overrides to xcodebuild, and the
      # generated project uses automatic signing — which needs an Apple
      # account ("No Accounts" / "No profiles"). Turn signing off in the
      # project itself; AltStore / SideStore re-sign the .ipa anyway.
      - name: Disable code signing in the Xcode project
        working-directory: crates/aqua-client-ui/gen/apple
        run: |
          pbx=$(ls -d *.xcodeproj)/project.pbxproj
          perl -0pi -e '
            s/^\s*CODE_SIGNING_(?:ALLOWED|REQUIRED) = [^;]*;\n//mg;
            s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g;
            s/("?CODE_SIGN_IDENTITY(?:\[sdk=iphoneos\*\])?"?) = [^;]*;/$1 = "";/g;
            s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g;
            s/(PROVISIONING_PROFILE_SPECIFIER|PROVISIONING_PROFILE) = [^;]*;/$1 = "";/g;
            s/(buildSettings = \{\n)/$1\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n/g;
          ' "$pbx"
          sed -i '' 's/DevelopmentTeam = [^;]*;/DevelopmentTeam = "";/; s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/' "$pbx"
          grep -nE 'CODE_SIGN|DEVELOPMENT_TEAM|ProvisioningStyle' "$pbx" | head -40

      - name: Build (no code signing)
        working-directory: crates/aqua-client-ui
        env:
          APPLE_DEVELOPMENT_TEAM: "0000000000"
        run: |
          printf 'CODE_SIGNING_ALLOWED = NO\nCODE_SIGNING_REQUIRED = NO\nCODE_SIGN_IDENTITY =\nDEVELOPMENT_TEAM =\n' > "$RUNNER_TEMP/nosign.xcconfig"
          export XCODE_XCCONFIG_FILE="$RUNNER_TEMP/nosign.xcconfig"
          # The archive step succeeds unsigned; only the final export needs a
          # certificate, so its failure is expected here. Keep the log for
          # the packaging step's diagnostics.
          set +e
          # Signing is switched off in the project itself (previous step).
          # Don't pass xcodebuild settings after `--`: Tauri forwards those to
          # `cargo build`, which rejects them ("unexpected argument").
          cargo tauri ios build --target aarch64 --ci > "$RUNNER_TEMP/ios.log" 2>&1
          echo "tauri ios build exit code: $?"
          tail -120 "$RUNNER_TEMP/ios.log"
          exit 0

      - name: Package .ipa
        run: |
          set -e
          # Only a real bundle counts: a failed build can leave an empty
          # Aquamarine.app shell behind (that shipped a 300-byte .ipa once).
          app=
          while IFS= read -r a; do
            if [ -f "$a/Info.plist" ] && [ -n "$(find "$a" -maxdepth 1 -type f -perm -u+x | head -1)" ]; then app="$a"; break; fi
          done < <(
            find crates/aqua-client-ui "$HOME/Library/Developer/Xcode/Archives" -type d -path '*.xcarchive/Products/Applications/*.app' 2>/dev/null
            find crates/aqua-client-ui "$HOME/Library/Developer/Xcode/DerivedData" -type d -name '*.app' -path '*iphoneos*' 2>/dev/null
          )
          if [ -z "$app" ]; then
            # Surface the cause as annotations (readable without the raw log).
            enc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
            echo "::error title=iOS build errors::$(grep -iE 'error|failed|cannot|not found' "$RUNNER_TEMP/ios.log" | grep -v '^warning' | tail -30 | enc)"
            echo "::error title=iOS build log tail::$(tail -40 "$RUNNER_TEMP/ios.log" | enc)"
            echo "::error title=gen/apple tree::$(find crates/aqua-client-ui/gen/apple -maxdepth 3 2>/dev/null | head -60 | enc)"
            exit 1
          fi
          echo "app: $app"
          mkdir -p dist/Payload && cp -R "$app" dist/Payload/
          (cd dist && zip -qry Aquamarine-iOS-unsigned.ipa Payload && rm -rf Payload)
          ls -la dist
          size=$(stat -f%z dist/Aquamarine-iOS-unsigned.ipa)
          [ "$size" -gt 100000 ] || { echo "::error title=iOS::.ipa is only $size bytes - the app bundle is empty"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: aquamarine-ios
          path: dist/*.ipa
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa

  # ---------------------------------------------------------------- server
  server:
    name: server (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            rust-target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            name: macos-arm64
            rust-target: aarch64-apple-darwin
            ext: ""
          - os: ubuntu-22.04
            name: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-22.04
            name: linux-arm64
            rust-target: aarch64-unknown-linux-gnu
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: ARM64 Linux cross-linker
        if: matrix.name == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: server-${{ matrix.name }}

      - name: Build server
        run: cargo build --release -p aqua-server --target ${{ matrix.rust-target }}

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.rust-target }}/release/aqua-server${{ matrix.ext }}" \
             "dist/aqua-server-${{ matrix.name }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: aqua-server-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
