<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Aquamarine's mark: the letter A of two legs, a star inside, and the
       arc under it — a link between two points (the network). -->
  <defs>
    <linearGradient id="legL" x1="0.62" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#8CFAD6"/>
      <stop offset="0.55" stop-color="#2CC495"/>
      <stop offset="1" stop-color="#0B6A50"/>
    </linearGradient>
    <linearGradient id="legR" x1="0.3" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3FD9A6"/>
      <stop offset="1" stop-color="#0A4B3A"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0C5E47"/>
      <stop offset="0.6" stop-color="#2BC394"/>
      <stop offset="1" stop-color="#B4FFE6"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9BF7D8"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M256 44 L60 452 Q57 458 64 458 L150 458 L256 196 Z" fill="url(#legL)"/>
  <path d="M256 44 L256 196 L366 458 L448 458 Q455 458 452 452 Z" fill="url(#legR)"/>
  <path d="M116 446 C190 360 300 318 446 346 L452 374 C320 352 218 386 150 462 L104 462 Z" fill="url(#arc)"/>
  <path d="M256 262 C259 288 266 296 292 300 C266 304 259 312 256 338 C253 312 246 304 220 300 C246 296 253 288 256 262 Z" fill="url(#star)" filter="url(#glow)"/>
</svg>
