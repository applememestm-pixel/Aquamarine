name: windows-build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  server:
    name: aqua-server.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: server

      - name: Build server
        run: cargo build --release -p aqua-server

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target\release\aqua-server.exe dist\aqua-server.exe

      - uses: actions/upload-artifact@v4
        with:
          name: aqua-server-windows-x64
          path: dist/aqua-server.exe
          if-no-files-found: error

      - name: Attach to release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/aqua-server.exe

  desktop:
    name: aqua-client-ui (Tauri)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/aqua-client-ui/ui/package-lock.json

      - name: Cache Cargo (Tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/aqua-client-ui -> target
          shared-key: tauri

      - name: Install frontend deps
        working-directory: crates/aqua-client-ui/ui
        run: npm ci

      - name: Build frontend
        working-directory: crates/aqua-client-ui/ui
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build Tauri app (release, no bundles)
        working-directory: crates/aqua-client-ui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
        run: cargo tauri build --no-bundle

      - name: Collect artifact
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item crates\aqua-client-ui\target\release\aqua-client-ui.exe dist\aquamarine.exe

      - uses: actions/upload-artifact@v4
        with:
          name: aquamarine-windows-x64
          path: dist/aquamarine.exe
          if-no-files-found: error

      - name: Attach to release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/aquamarine.exe
