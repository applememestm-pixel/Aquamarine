name: net probe
# Temporary: is the public relay reachable from abroad (as through a VPN exit)?
on:
  push:
    paths: [.github/workflows/net-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in http://193.233.245.196:7777/v1/stats http://193.233.245.196/ https://193.233.245.196/; do
            echo "== $u"; curl -sS -m 15 -o /dev/null -w "code=%{http_code} connect=%{time_connect}s total=%{time_total}s\n" -k "$u" || true
          done
          curl -sS -m 15 http://193.233.245.196:7777/v1/stats | head -c 300; echo
          curl -sS -m 10 "https://ipwho.is/193.233.245.196?fields=country,city,connection" ; echo
          nc -vz -w 8 193.233.245.196 7777 || true
          traceroute -n -T -p 7777 -m 25 -w 2 193.233.245.196 2>&1 | tail -8 || true
