name: release signing check

# The release key without a release (owner, 25.11): UPDATE_PUBKEY must be
# the public half of UPDATE_SIGNING_KEY; a SHA256SUMS.txt made like
# release.yml's is signed with tools/release-sign.sh (the script release.yml
# uses) and checked by aqua-core built with AQUA_UPDATE_PUBKEY — as the apps
# are — including a swapped file, edited sums, a wrong signature and a
# build without the key. Only the public key is printed; the private one
# lives in a 0600 temp file outside the workspace while a step runs.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-signing-check.yml"
      - "tools/release-sign.sh"
      - "crates/aqua-core/src/release.rs"
      - "crates/aqua-core/tests/release_signing.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: release signing (real key)
    runs-on: ubuntu-22.04
    env:
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      AQUA_UPDATE_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - name: the secret and the variable are set and belong together
        run: |
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error::secret UPDATE_SIGNING_KEY is not available"; exit 1; }
          [ -n "$AQUA_UPDATE_PUBKEY" ] || { echo "::error::variable UPDATE_PUBKEY is not set"; exit 1; }
          pub=$(bash tools/release-sign.sh pub)
          want=$(echo "$AQUA_UPDATE_PUBKEY" | tr 'A-F' 'a-f' | tr -d ' \n')
          echo "public half of the secret: $pub"
          echo "UPDATE_PUBKEY:             $want"
          [ "${#want}" -eq 64 ] || { echo "::error::UPDATE_PUBKEY must be 64 hex digits"; exit 1; }
          [ "$pub" = "$want" ] || { echo "::error::they don't match"; exit 1; }
          echo "match: yes"
      - name: a release-like SHA256SUMS.txt, signed like release.yml signs it
        run: |
          d="$RUNNER_TEMP/rel"; mkdir -p "$d"; cd "$d"
          head -c 300000 /dev/urandom > Aquamarine_test_x64-setup.exe
          head -c 200000 /dev/urandom > Aquamarine_test.apk
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          bash "$GITHUB_WORKSPACE/tools/release-sign.sh" sign SHA256SUMS.txt SHA256SUMS.txt.sig
          # Independent check with openssl and the PUBLIC key only.
          printf '302a300506032b6570032100%s' "$AQUA_UPDATE_PUBKEY" | xxd -r -p > pub.der 2>/dev/null || \
            python3 -c "import sys;open('pub.der','wb').write(bytes.fromhex('302a300506032b6570032100'+sys.argv[1]))" "$AQUA_UPDATE_PUBKEY"
          python3 -c "import sys;open('sig.bin','wb').write(bytes.fromhex(open('SHA256SUMS.txt.sig').read().strip()))"
          openssl pkeyutl -verify -pubin -keyform DER -inkey pub.der -rawin -in SHA256SUMS.txt -sigfile sig.bin
          ls -la "$d"
          # No private key material left anywhere we can see.
          if grep -rl "BEGIN PRIVATE KEY" "$d" "$RUNNER_TEMP" 2>/dev/null; then echo "::error::private key left on disk"; exit 1; fi
          if git -C "$GITHUB_WORKSPACE" status --porcelain | grep -q .; then git -C "$GITHUB_WORKSPACE" status --porcelain; echo "::error::files appeared in the checkout"; exit 1; fi
          echo "RELEASE_SIGNING_DIR=$d" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the apps' check (aqua-core built with the key) — good, swapped, edited, wrong, missing
        run: cargo test -p aqua-core --test release_signing -- --nocapture
      - name: the release module's own tests (incl. a build without a key)
        env:
          AQUA_UPDATE_PUBKEY: ""
          RELEASE_SIGNING_DIR: ""
        run: cargo test -p aqua-core release
