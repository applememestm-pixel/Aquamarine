[package]
name        = "aqua-server-app"
version     = "1.2.11"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Aquamarine Server — the relay as its own app (Windows, macOS, Linux, Android)."

[lib]
name       = "aqua_server_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aqua-server-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aqua-server = { path = "../aqua-server" }
tauri       = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-opener = { version = "2" }
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex         = "0.4"
sha2        = "0.10"
rand        = "0.8"
dirs        = "5"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"   # "Start with the system"
tauri-plugin-single-instance = "2"   # a second launch shows the running window (no "port busy")

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 4
