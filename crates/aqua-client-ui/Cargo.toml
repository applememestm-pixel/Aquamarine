[package]
name        = "aqua-client-ui"
version     = "1.0.6"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Aquamarine desktop shell — Tauri 2 + Svelte + TypeScript."

[lib]
name       = "aqua_client_ui_lib"
# staticlib → iOS, cdylib → Android, rlib → the desktop binary.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aqua-client-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aqua-core        = { path = "../aqua-core" }
aqua-client-core = { path = "../aqua-client-core" }
# "Server on this device": the relay runs inside the app (relay_host.rs).
aqua-server      = { path = "../aqua-server" }

tauri               = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log    = { version = "2" }
log = "0.4"
futures-util = "0.3"
flate2 = "1"
tauri-plugin-dialog = { version = "2" }
tauri-plugin-fs     = { version = "2" }  # reads Android content:// picks
infer               = "0.22"             # sniff type/extension of such picks
dirs                = "5"

tokio        = { version = "1", features = ["full"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
serde_bytes  = "0.11"
bincode      = "1.3"
base64       = "0.22"
thiserror    = "2"
anyhow       = "1"
hex          = "0.4"
sha2         = "0.10"
reqwest      = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tiny_http    = "0.12"
rand         = "0.8"

# OS keychain on desktop only (phones keep the key in the app sandbox).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Linux: tune the WebKitGTK webview (WebRTC is off there by default).
# "Now playing" from the Windows media session (Spotify, browsers, Яндекс
# Музыка, Media Player… — anything that shows in the volume flyout).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Media_Control", "Foundation", "Foundation_Collections", "Win32_System_WinRT",
  # Nearby delivery over Bluetooth (mesh_windows.rs)
  "Devices_Bluetooth", "Devices_Bluetooth_Rfcomm", "Devices_Enumeration",
  "Networking", "Networking_Sockets", "Storage_Streams",
] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_38"] }
# "Now playing" from other apps (MPRIS: Spotify, browsers, mpv, …).
zbus = { version = "5", default-features = false, features = ["tokio"] }
# fcntl / socket timeouts on the Bluetooth RFCOMM socket (mesh_linux.rs).
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
# By default, Tauri runs in production mode. When `tauri dev` runs, it
# is executed with `cargo run --no-default-features` if `devPath` is an
# URL in `tauri.conf.json` — but since we always ship both dev URL and
# built assets, we don't need custom features here.
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
# `--cfg aqua_wincheck` type-checks the Windows-only activity detector on Linux.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aqua_wincheck)', 'cfg(aqua_mobilecheck)'] }

# Smaller, faster release binary (cross-crate inlining).
[profile.release]
lto = "thin"
codegen-units = 4
