name: server app (android)

# Builds the Aquamarine Server APK on pull requests that touch it — the same
# steps as release.yml, without signing or publishing.
on:
  pull_request:
    branches: [main]
    paths:
      - "crates/aqua-server-app/**"
      - "crates/aqua-server/**"
      - ".github/workflows/server-app-android.yml"
  workflow_dispatch:

concurrency:
  group: server-app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: server app APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/aqua-server-app -> target
          shared-key: server-app-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Generate Android project
        working-directory: crates/aqua-server-app
        run: |
          cargo tauri android init --ci
          m=gen/android/app/src/main/AndroidManifest.xml
          act="$(find gen/android/app/src/main/java -name MainActivity.kt | head -1)"
          cp android/AquaServer.kt "$(dirname "$act")/AquaServer.kt"
          cp -r icons/android/* gen/android/app/src/main/res/
          perms='<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application'
          sed -i "0,/<application/s##${perms}#" "$m"
          svc='<service android:name=".AquaServerService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Hosts the Aquamarine relay server for the user and their contacts" /></service>\n    </application>'
          sed -i "s#</application>#${svc}#" "$m"
          mkdir -p gen/android/app/src/main/res/xml
          cp android/netsec.xml gen/android/app/src/main/res/xml/network_security_config.xml
          sed -i '0,/<application/s##<application android:networkSecurityConfig="@xml/network_security_config"#' "$m"
          grep -n 'AquaServerService\|FOREGROUND\|networkSecurityConfig' "$m"

      - name: Build APK
        working-directory: crates/aqua-server-app
        run: cargo tauri android build --apk --target aarch64 --target armv7 --ci

